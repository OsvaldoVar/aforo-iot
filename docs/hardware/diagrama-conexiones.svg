<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <style>
      .titulo { font-family: sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitulo { font-family: sans-serif; font-size: 14px; fill: #4b5563; }
      .caja-titulo { font-family: sans-serif; font-size: 16px; font-weight: 700; fill: #111827; }
      .pin { font-family: sans-serif; font-size: 14px; font-weight: 600; fill: #1f2937; }
      .cable-etq { font-family: sans-serif; font-size: 14px; font-weight: 700; }
      .nota { font-family: sans-serif; font-size: 14px; fill: #374151; }
      .alerta { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #b91c1c; }
      .leyenda { font-family: sans-serif; font-size: 14px; fill: #1f2937; }
      .resistor-txt { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #422006; }
    </style>
  </defs>

  <!-- Fondo blanco -->
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- Encabezado -->
  <text x="500" y="34" text-anchor="middle" class="titulo">Diagrama de conexiones — Aforo IoT (ESP32 DevKit)</text>

  <!-- Bus superior de 3.3 V (rojo) -->
  <polyline points="390,175 355,175 355,64 966,64 966,425 945,425" fill="none" stroke="#d32f2f" stroke-width="3"/>
  <line x1="945" y1="150" x2="966" y2="150" stroke="#d32f2f" stroke-width="3"/>
  <circle cx="966" cy="150" r="4" fill="#d32f2f"/>
  <text x="660" y="56" text-anchor="middle" class="cable-etq" fill="#d32f2f">Riel 3.3 V (alimentación común)</text>

  <!-- Bus inferior y lateral izquierdo de GND (negro) -->
  <polyline points="20,235 20,530 984,530 984,310 945,310" fill="none" stroke="#212121" stroke-width="3"/>
  <polyline points="390,465 355,465 355,530" fill="none" stroke="#212121" stroke-width="3"/>
  <circle cx="355" cy="530" r="4" fill="#212121"/>
  <line x1="20" y1="235" x2="40" y2="235" stroke="#212121" stroke-width="3"/>
  <line x1="20" y1="315" x2="40" y2="315" stroke="#212121" stroke-width="3"/>
  <circle cx="20" cy="315" r="4" fill="#212121"/>
  <line x1="20" y1="395" x2="40" y2="395" stroke="#212121" stroke-width="3"/>
  <circle cx="20" cy="395" r="4" fill="#212121"/>
  <line x1="945" y1="465" x2="984" y2="465" stroke="#212121" stroke-width="3"/>
  <circle cx="984" cy="465" r="4" fill="#212121"/>
  <text x="500" y="550" text-anchor="middle" class="cable-etq" fill="#212121">Riel GND (tierra común)</text>

  <!-- Cables de senales lado izquierdo (verde / naranja) -->
  <!-- GPIO 25 -> 220 ohm -> LED verde -->
  <line x1="390" y1="235" x2="280" y2="235" stroke="#2e7d32" stroke-width="3"/>
  <line x1="204" y1="235" x2="170" y2="235" stroke="#2e7d32" stroke-width="3"/>
  <text x="335" y="226" text-anchor="middle" class="cable-etq" fill="#2e7d32">GPIO 25</text>

  <!-- GPIO 26 -> 220 ohm -> LED rojo -->
  <line x1="390" y1="315" x2="280" y2="315" stroke="#e65100" stroke-width="3"/>
  <line x1="204" y1="315" x2="170" y2="315" stroke="#e65100" stroke-width="3"/>
  <text x="335" y="306" text-anchor="middle" class="cable-etq" fill="#e65100">GPIO 26</text>

  <!-- GPIO 27 -> Buzzer -->
  <line x1="390" y1="395" x2="170" y2="395" stroke="#e65100" stroke-width="3"/>
  <text x="280" y="386" text-anchor="middle" class="cable-etq" fill="#e65100">GPIO 27</text>

  <!-- Cables SPI lado derecho (azul) -->
  <line x1="600" y1="150" x2="745" y2="150" stroke="#1565c0" stroke-width="3"/>
  <text x="672" y="143" text-anchor="middle" class="cable-etq" fill="#1565c0">GPIO 5</text>

  <line x1="600" y1="190" x2="745" y2="190" stroke="#1565c0" stroke-width="3"/>
  <text x="672" y="183" text-anchor="middle" class="cable-etq" fill="#1565c0">GPIO 18</text>

  <line x1="600" y1="230" x2="745" y2="230" stroke="#1565c0" stroke-width="3"/>
  <text x="672" y="223" text-anchor="middle" class="cable-etq" fill="#1565c0">GPIO 23</text>

  <line x1="600" y1="270" x2="745" y2="270" stroke="#1565c0" stroke-width="3"/>
  <text x="672" y="263" text-anchor="middle" class="cable-etq" fill="#1565c0">GPIO 19</text>

  <line x1="600" y1="310" x2="745" y2="310" stroke="#1565c0" stroke-width="3"/>
  <text x="672" y="303" text-anchor="middle" class="cable-etq" fill="#1565c0">GPIO 22</text>

  <!-- Cable DHT11 DATA (verde) + Pull-up 10 kohm -->
  <line x1="600" y1="425" x2="745" y2="425" stroke="#2e7d32" stroke-width="3"/>
  <text x="672" y="416" text-anchor="middle" class="cable-etq" fill="#2e7d32">GPIO 4</text>
  <circle cx="672" cy="425" r="4" fill="#2e7d32"/>
  <line x1="672" y1="425" x2="672" y2="448" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="636" y="448" width="72" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="672" y="466" text-anchor="middle" class="resistor-txt">10 k&#937;</text>
  <line x1="672" y1="474" x2="672" y2="494" stroke="#d32f2f" stroke-width="2.5"/>
  <circle cx="672" cy="494" r="4" fill="#d32f2f"/>
  <text x="672" y="514" text-anchor="middle" class="cable-etq" fill="#d32f2f">3.3 V (pull-up)</text>

  <!-- Resistencias 220 ohm para LEDs -->
  <rect x="204" y="222" width="76" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="242" y="240" text-anchor="middle" class="resistor-txt">220 &#937;</text>

  <rect x="204" y="302" width="76" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="242" y="320" text-anchor="middle" class="resistor-txt">220 &#937;</text>

  <!-- Caja central: ESP32 DevKit -->
  <rect x="390" y="100" width="210" height="395" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <rect x="445" y="92" width="100" height="16" rx="3" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <text x="495" y="128" text-anchor="middle" class="caja-titulo">ESP32 DevKit</text>
  <text x="495" y="146" text-anchor="middle" class="subtitulo">USB / WiFi 2.4 GHz</text>

  <!-- Pines izquierdos del ESP32 -->
  <circle cx="390" cy="175" r="5" fill="#d32f2f"/>
  <text x="402" y="180" class="pin">3.3V</text>

  <circle cx="390" cy="235" r="5" fill="#2e7d32"/>
  <text x="402" y="240" class="pin">GPIO 25</text>

  <circle cx="390" cy="315" r="5" fill="#e65100"/>
  <text x="402" y="320" class="pin">GPIO 26</text>

  <circle cx="390" cy="395" r="5" fill="#e65100"/>
  <text x="402" y="400" class="pin">GPIO 27</text>

  <circle cx="390" cy="465" r="5" fill="#212121"/>
  <text x="402" y="470" class="pin">GND</text>

  <!-- Pines derechos del ESP32 -->
  <circle cx="600" cy="150" r="5" fill="#1565c0"/>
  <text x="588" y="155" text-anchor="end" class="pin">GPIO 5</text>

  <circle cx="600" cy="190" r="5" fill="#1565c0"/>
  <text x="588" y="195" text-anchor="end" class="pin">GPIO 18</text>

  <circle cx="600" cy="230" r="5" fill="#1565c0"/>
  <text x="588" y="235" text-anchor="end" class="pin">GPIO 23</text>

  <circle cx="600" cy="270" r="5" fill="#1565c0"/>
  <text x="588" y="275" text-anchor="end" class="pin">GPIO 19</text>

  <circle cx="600" cy="310" r="5" fill="#1565c0"/>
  <text x="588" y="315" text-anchor="end" class="pin">GPIO 22</text>

  <circle cx="600" cy="425" r="5" fill="#2e7d32"/>
  <text x="588" y="430" text-anchor="end" class="pin">GPIO 4</text>

  <!-- Componente: LED verde -->
  <rect x="40" y="205" width="130" height="60" rx="8" fill="#ecfdf5" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="64" cy="235" r="10" fill="#22c55e" stroke="#166534" stroke-width="2"/>
  <text x="82" y="231" class="caja-titulo">LED verde</text>
  <text x="82" y="250" class="nota">(-) GND  (+) A</text>

  <!-- Componente: LED rojo -->
  <rect x="40" y="285" width="130" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="64" cy="315" r="10" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <text x="82" y="311" class="caja-titulo">LED rojo</text>
  <text x="82" y="330" class="nota">(-) GND  (+) A</text>

  <!-- Componente: Buzzer -->
  <rect x="40" y="365" width="130" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <circle cx="64" cy="395" r="10" fill="#374151" stroke="#111827" stroke-width="2"/>
  <circle cx="64" cy="395" r="3" fill="#ffffff"/>
  <text x="82" y="391" class="caja-titulo">Buzzer</text>
  <text x="82" y="410" class="nota">(-) GND  (+)</text>

  <!-- Componente: Módulo RC522 -->
  <rect x="745" y="100" width="200" height="255" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="845" y="126" text-anchor="middle" class="caja-titulo">Módulo RC522</text>

  <circle cx="745" cy="150" r="5" fill="#1565c0"/>
  <text x="757" y="155" class="pin">SDA / SS</text>

  <circle cx="745" cy="190" r="5" fill="#1565c0"/>
  <text x="757" y="195" class="pin">SCK</text>

  <circle cx="745" cy="230" r="5" fill="#1565c0"/>
  <text x="757" y="235" class="pin">MOSI</text>

  <circle cx="745" cy="270" r="5" fill="#1565c0"/>
  <text x="757" y="275" class="pin">MISO</text>

  <circle cx="745" cy="310" r="5" fill="#1565c0"/>
  <text x="757" y="315" class="pin">RST</text>

  <circle cx="945" cy="150" r="5" fill="#d32f2f"/>
  <text x="933" y="155" text-anchor="end" class="pin">3.3V</text>

  <circle cx="945" cy="310" r="5" fill="#212121"/>
  <text x="933" y="315" text-anchor="end" class="pin">GND</text>

  <text x="845" y="343" text-anchor="middle" class="alerta">Solo 3.3 V (NO 5 V)</text>

  <!-- Componente: Sensor DHT11 -->
  <rect x="745" y="378" width="200" height="122" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="845" y="402" text-anchor="middle" class="caja-titulo">DHT11 (o DHT22)</text>

  <circle cx="745" cy="425" r="5" fill="#2e7d32"/>
  <text x="757" y="430" class="pin">DATA</text>

  <circle cx="945" cy="425" r="5" fill="#d32f2f"/>
  <text x="933" y="430" text-anchor="end" class="pin">VCC</text>

  <circle cx="945" cy="465" r="5" fill="#212121"/>
  <text x="933" y="470" text-anchor="end" class="pin">GND</text>

  <text x="845" y="490" text-anchor="middle" class="nota">Pull-up 10 k&#937; si no trae</text>

  <!-- Leyenda -->
  <rect x="20" y="572" width="960" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="602" class="pin">Leyenda:</text>

  <line x1="110" y1="597" x2="150" y2="597" stroke="#d32f2f" stroke-width="4"/>
  <text x="160" y="602" class="leyenda">3.3 V</text>

  <line x1="225" y1="597" x2="265" y2="597" stroke="#212121" stroke-width="4"/>
  <text x="275" y="602" class="leyenda">GND</text>

  <line x1="340" y1="597" x2="380" y2="597" stroke="#1565c0" stroke-width="4"/>
  <text x="390" y="602" class="leyenda">Bus SPI (RC522)</text>

  <line x1="540" y1="597" x2="580" y2="597" stroke="#2e7d32" stroke-width="4"/>
  <text x="590" y="602" class="leyenda">Señales (DHT / LED verde)</text>

  <line x1="790" y1="597" x2="830" y2="597" stroke="#e65100" stroke-width="4"/>
  <text x="840" y="602" class="leyenda">LED rojo / Buzzer</text>
</svg>
